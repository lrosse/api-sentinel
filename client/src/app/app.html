<main class="shell">
  <section class="hero" aria-labelledby="page-title">
    <p class="eyebrow">Marco 0 · Setup</p>
    <h1 id="page-title">API Sentinel <span>— em construção</span></h1>
    <p class="intro">
      A base da plataforma está no ar. Monitoramento e detecção de mudanças de contrato chegam nos
      próximos marcos.
    </p>

    <div class="health" aria-live="polite">
      <span
        class="health__indicator"
        [class.health__indicator--online]="apiOnline() === true"
        [class.health__indicator--offline]="apiOnline() === false"
        aria-hidden="true"
      ></span>
      <div>
        <span class="health__label">API health check</span>
        <strong>{{ healthStatus() }}</strong>
      </div>
    </div>
  </section>
</main>
