name: api-sentinel

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/ApiSentinel.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ApiSentinel;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      DataProtection__KeysPath: /var/lib/api-sentinel/data-protection-keys
      SeedData__Enabled: "${SEED_DEV_DATA:-false}"
    ports:
      - "8080:8080"
    volumes:
      - data_protection_keys:/var/lib/api-sentinel/data-protection-keys
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - ./src:/src:ro
      - client_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4200').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  mock-api-1:
    build:
      context: .
      dockerfile: mocks/mock-api-1/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5001:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/produtos"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mock-api-2:
    build:
      context: .
      dockerfile: mocks/mock-api-2/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5002:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/produtos"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  sqlserver_data:
  data_protection_keys:
  client_node_modules:
